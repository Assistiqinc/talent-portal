function allInterviews(){

}

/* ---------- bench ---------- */
function match(d){
  const e=edv(d.id);
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(q){const hay=[d.name,d.headline,d.location,d.education,d.strengths,d.english_level,(d.tech_tools||[]).join(' '),(d.industries||[]).join(' '),(d.best_fit_roles||[]).join(' '),d.source,e.notes||'',e.role||''].join(' ').toLowerCase();
    if(!q.split(/\s+/).every(t=>hay.includes(t)))return false;}
  const r=document.getElementById('role').value;if(r&&!d.best_fit_roles.includes(r))return false;
  const sv=document.getElementById('src').value;if(sv&&d.source!==sv)return false;
  const sf=document.getElementById('stagef').value;if(sf&&stageOf(d)!==sf)return false;
  const ev=document.getElementById('eng').value;
  if(ev==='C1'&&ENGRANK[d.english_level]<4)return false;
  if(ev==='B2'&&ENGRANK[d.english_level]<3)return false;
  if(d.fit_score<+document.getElementById('fit').value)return false;
  for(const k in filters)if(filters[k]&&!d[k])return false;
  if(photoOnly&&!d.photo)return false;
  return true;
}

async function persistFields(id,fields,msgEl){
  const row=Object.assign({candidate_id:+id,updated_by:ME,updated_at:new Date().toISOString()},fields);
  const {error}=await sb.from('talent_edits').upsert(row,{onConflict:'candidate_id'});
  if(error){if(msgEl){msgEl.textContent='⚠ No se guardó: '+error.message;} return false;}
  return true;
}
async function persistEdit(id,msgEl){
  const e=edv(id);
  return persistFields(id,{stage:e.stage||null,role:e.role||null,verified_english:e.verified_english||null,
    availability:e.availability||null,salary:e.salary||null,call_score:String(e.call_score||'')||null,
    notes:e.notes||null,next_action:e.next_action||null,next_date:e.next_date||null,
    checks:e.checks||{}},msgEl);
}
const FMAP={f_stage:'stage',f_role:'role',f_veng:'verified_english',f_avail:'availability',
  f_salary:'salary',f_score:'call_score',f_notes:'notes',f_na:'next_action',f_nad:'next_date'};
async function saveFields(){
  const e=ed(openId);
  e.stage=document.getElementById('f_stage').value;
  e.role=document.getElementById('f_role').value.trim();
  e.verified_english=document.getElementById('f_veng').value;
  e.availability=document.getElementById('f_avail').value.trim();
  e.salary=document.getElementById('f_salary').value.trim();
  e.call_score=document.getElementById('f_score').value;
  e.notes=document.getElementById('f_notes').value.trim();
  e.next_action=document.getElementById('f_na').value.trim();
  e.next_date=document.getElementById('f_nad').value.trim();
  const m=document.getElementById('f_msg');
  const ev=arguments[0];
  const fk=ev&&ev.target&&FMAP[ev.target.id];
  const ok=fk?await persistFields(openId,{[fk]:e[fk]||null},m):await persistEdit(openId,m);
  if(ok&&m){
    if(e.stage==='Verificado'&&chkCount(openId)<5){m.textContent='⚠ Verificado con '+chkCount(openId)+'/5 checks';}
    else{m.textContent='Guardado ✓';setTimeout(()=>{if(m)m.textContent='';},1400);}
  }
  renderStats();
}
async function addIv(){
  const e=ed(openId); e.interviews=e.interviews||[];
  const iv={when:document.getElementById('iv_when').value,who:document.getElementById('iv_who').value.trim(),
            type:document.getElementById('iv_type').value,result:document.getElementById('iv_res').value,
            notes:document.getElementById('iv_notes').value.trim()};

  const {error}=await sb.from('talent_interviews').insert({candidate_id:+openId,when_at:iv.when||null,
    who:iv.who||null,type:iv.type||null,result:iv.result||null,notes:iv.notes||null,created_by:ME});
  if(error){document.getElementById('ivmsg').textContent='⚠ No se guardó: '+error.message;return;}

/* ---------- pipeline ---------- */
let KEXP={};
function renderPipeline(){
  const cols=STAGES.map(s=>{
    const g=DATA.filter(d=>stageOf(d)===s);
    const lim=KEXP[s]?g.length:12;
    const cards=g.slice(0,lim).map(d=>{
      const e=edv(d.id);
      const next=(e.interviews||[]).filter(iv=>iv.when&&iv.when>=todayISO()).sort((a,b)=>a.when<b.when?-1:1)[0];
      return `<div class="kcard" draggable="true" data-id="${d.id}"><div class="knm">${esc(d.name)}</div>
        <div class="ksb">${esc(d.english_level)} · fit ${d.fit_score}${e.role?' · '+esc(e.role):''}${next?'<br>&#128197; '+esc(next.when.replace('T',' ')):''}${e.next_action?'<br>&#9873; '+esc(e.next_action)+(e.next_date?' · '+esc(e.next_date):''):''}</div></div>`;
    }).join('')||'<div class="ksb" style="padding:6px;color:#8a8578">—</div>';
    const more=g.length>lim?`<button class="kmore" data-s="${s}">Ver ${g.length-lim} más</button>`:'';
    return `<div class="kcol${g.length?'':' kempty'}" data-s="${s}"><h4>${s}<span>${g.length}</span></h4><div class="kbody">${cards}${more}</div></div>`;
  }).join('');
  document.getElementById('kb').innerHTML=cols;
  document.querySelectorAll('.kcard').forEach(c=>{
    c.addEventListener('dragstart',ev=>{DRAGID=+c.dataset.id;c.classList.add('dragging');
      ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',c.dataset.id);}catch(e){}});
    c.addEventListener('dragend',()=>{c.classList.remove('dragging');DRAGJUST=true;setTimeout(()=>DRAGJUST=false,350);
      document.querySelectorAll('.kcol').forEach(k=>k.classList.remove('dropok'));});
  });
  document.querySelectorAll('.kcol').forEach(k=>{
    k.addEventListener('dragenter',ev=>{ev.preventDefault();k.classList.add('dropok');});
    k.addEventListener('dragover',ev=>{ev.preventDefault();try{ev.dataTransfer.dropEffect='move';}catch(e){}k.classList.add('dropok');});
    k.addEventListener('dragleave',ev=>{if(!k.contains(ev.relatedTarget))k.classList.remove('dropok');});
    k.addEventListener('drop',async ev=>{ev.preventDefault();k.classList.remove('dropok');
      const id=DRAGID;const s=k.dataset.s;DRAGID=null;
      if(!id||!s)return;
      const e=ed(id);const cur=e.stage||'Nuevo';if(cur===s)return;
      e.stage=s;
      renderPipeline();renderStats();
      await persistFields(id,{stage:s},null);});
  });
}
document.getElementById('kb').addEventListener('click',e=>{
  if(DRAGJUST)return;
  const m=e.target.closest('.kmore'); if(m){KEXP[m.dataset.s]=true;renderPipeline();return;}
  const c=e.target.closest('.kcard'); if(c)openDetail(+c.dataset.id);
});

/* ---------- analytics ---------- */
function bars(items,max){
  return items.map(([lab,n,mut])=>`<div class="arow"><div>${esc(lab)}</div><div class="abar"><i class="${mut?'mut':''}" style="width:${max?Math.round(n/max*100):0}%"></i></div><div style="text-align:right"><b>${n}</b></div></div>`).join('');
}
function renderAna(){
  const stage=STAGES.map(s=>[s,DATA.filter(d=>stageOf(d)===s).length]);
  const smax=Math.max(...stage.map(x=>x[1]),1);
  const eng=['Native','C2','C1 / Advanced','B2 / Intermediate','B1','Basic','Unknown'].map(k=>[k,DATA.filter(d=>d.english_level===k).length,ENGRANK[k]<4]);
  const emax=Math.max(...eng.map(x=>x[1]),1);
  const roles=[...new Set(DATA.flatMap(d=>d.best_fit_roles))].map(r=>{
    const p=DATA.filter(d=>d.best_fit_roles.includes(r));
    return [r,p.filter(d=>d.fit_score>=4&&ENGRANK[d.english_level]>=4&&d.phone_experience).length];
  }).sort((a,b)=>b[1]-a[1]);
  const rmax=Math.max(...roles.map(x=>x[1]),1);
  const src=[...new Set(DATA.map(d=>d.source))].map(s=>[s,DATA.filter(d=>d.source===s).length]);
  const scr=allInterviews().filter(x=>x.type==='Screen de voz');
  const pass=scr.filter(x=>x.result==='Pasó').length, fail=scr.filter(x=>x.result==='No pasó').length;
  document.getElementById('view-ana').innerHTML=`
    <div class="panelbox"><h3>Embudo por etapa</h3>${bars(stage,smax)}</div>
    <div class="panelbox"><h3>Cobertura de roles — candidatos LISTOS (fit 4+, C1+, teléfono)</h3>${bars(roles,rmax)}
      <div class="hl" style="margin-top:8px">Un rol con menos de 3 listos no soporta la garantía de warm bench de 3 operadores.</div></div>
    <div class="panelbox"><h3>Inglés declarado en CV</h3>${bars(eng,emax)}
      <div class="hl" style="margin-top:8px">Los niveles B2 e inferiores (barras grises) son autodeclarados sin certificar — requieren screen de voz antes de contar como bilingües.</div></div>
    <div class="panelbox"><h3>Screens de voz</h3>
      <div class="arow"><div>Realizados</div><div class="abar"><i style="width:${scr.length?100:0}%"></i></div><div style="text-align:right"><b>${scr.length}</b></div></div>
      <div class="arow"><div>Pasaron</div><div class="abar"><i style="width:${scr.length?Math.round(pass/Math.max(scr.length,1)*100):0}%"></i></div><div style="text-align:right"><b>${pass}</b></div></div>
      <div class="arow"><div>No pasaron</div><div class="abar"><i class="mut" style="width:${scr.length?Math.round(fail/Math.max(scr.length,1)*100):0}%"></i></div><div style="text-align:right"><b>${fail}</b></div></div></div>
    <div class="panelbox"><h3>Origen</h3>${bars(src,Math.max(...src.map(x=>x[1]),1))}</div>`;
}

/* ---------- data quality + export ---------- */
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,'').trim();}
function renderData(){
  const nm={},em={};
  DATA.forEach(d=>{const n=norm(d.name);if(n){(nm[n]=nm[n]||[]).push(d);}const e2=(d.email||'').toLowerCase();if(e2){(em[e2]=em[e2]||[]).push(d);}});
  const dupN=Object.values(nm).filter(g=>g.length>1), dupE=Object.values(em).filter(g=>g.length>1);
  const noC=DATA.filter(d=>!d.email&&!d.phone);
  const noE=DATA.filter(d=>!d.email&&d.phone);
  const usph=DATA.filter(d=>{const p=(d.phone||'').trim();return p.startsWith('+1')||p.startsWith('1 ')||/^\(\d{3}\)/.test(p)||p.includes('/ +1')||p.includes('+1 ');});
  const flag=DATA.filter(d=>/verificar|no declara|sin cv|no es un cv|mistyped|mal escrito|different name|otra persona/i.test(d.concerns||''));
  const li=g=>g.map(d=>`<tr class="click" data-id="${d.id}"><td><b>${esc(d.name)}</b></td><td>${esc(d.email||'—')}</td><td>${esc(d.phone||'—')}</td><td>${esc((d.concerns||'').slice(0,90))}${(d.concerns||'').length>90?'…':''}</td></tr>`).join('');
  const sec=(t,g)=>`<div class="panelbox"><h3>${t} (${g.length})</h3>${g.length?`<table class="tb"><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Alerta</th></tr>${li(g)}</table>`:'<div class="hl">Nada pendiente.</div>'}</div>`;
  document.getElementById('view-data').innerHTML=`
    <div class="panelbox"><h3>Datos compartidos</h3>
      <div class="hl" style="margin-bottom:12px">Todo se guarda autom&aacute;ticamente en la nube y lo ven los cuatro usuarios del equipo. Hay <b>${Object.keys(EDITS).length}</b> candidatos con avances. Usa <b>Actualizar</b> (arriba a la derecha) para traer cambios hechos por otros.</div>
      <button class="btn ghost" onclick="expCsv()">Exportar todo (CSV)</button>
      <span class="msg" id="datamsg"></span></div>
    ${sec('Posibles duplicados por nombre',dupN.flat())}
    ${dupE.length?sec('Duplicados por email',dupE.flat()):''}
    ${sec('Sin ningún contacto',noC)}
    ${sec('Solo teléfono, sin email',noE)}
    ${sec('Teléfono de EE.UU. — verificar residencia',usph)}
    ${sec('Alertas de identidad / ubicación',flag)}`;
  document.getElementById('view-data').querySelectorAll('tr.click').forEach(tr=>tr.addEventListener('click',()=>openDetail(+tr.dataset.id)));
}
function dl(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function expCsv(){
  const cols=['id','name','source','email','phone','location','headline','english_level','years_experience','fit_score','best_fit_roles','tech_tools'];
  const ecols=['stage','role','verified_english','availability','salary','call_score','notes'];
  const q=v=>'"'+String(Array.isArray(v)?v.join('; '):(v==null?'':v)).replace(/"/g,'""')+'"';
  const rows=[cols.concat(ecols,['entrevistas']).join(',')];
  DATA.forEach(d=>{const e=edv(d.id);
    rows.push(cols.map(c=>q(d[c])).concat(ecols.map(c=>q(e[c]||'')),[q((e.interviews||[]).map(iv=>`${iv.when||''} ${iv.type||''} ${iv.result||''}`).join(' | '))]).join(','));});
  dl('assistiq_bench_completo.csv','﻿'+rows.join('\n'),'text/csv;charset=utf-8');
}

/* ---------- búsquedas (client matching) ---------- */
function engRankOf(d){const e=edv(d.id);if(e.verified_english){return ({B1:2,B2:3,C1:4,C2:5})[e.verified_english]||0;}return ENGRANK[d.english_level]||0;}
const SYN={
  'techos':['roofing','roof','roofer'],'roofing':['techos'],
  'cercas':['fence','fences','fencing'],'fence':['cercas'],'fences':['cercas'],
  'ventanas':['window','windows','glazing'],'windows':['ventanas'],
  'garage':['garage','portón','overhead','door'],'puertas':['garage','door'],
  'dispatch':['despacho','dispatcher','dispatching'],'despacho':['dispatch','dispatcher'],
  'scheduling':['agenda','citas','appointment','scheduler'],'citas':['scheduling','appointment'],
  'ventas':['sales','outbound','closer'],'sales':['ventas','outbound'],
  'cobranza':['collections','billing'],'collections':['cobranza'],
  'seguros':['insurance','csr','policy'],'insurance':['seguros'],
  'inmobiliaria':['real estate','realtor','isa','leasing'],'real':['inmobiliaria','realtor','isa'],
  'plomería':['plumbing','hvac'],'plumbing':['plomería','hvac'],
  'hvac':['plumbing','electrical','contractor'],
  'home':['hvac','plumbing','roofing','contractor','field','remodeling'],
  'mudanzas':['moving','movers'],'moving':['mudanzas'],
  'logística':['logistics','freight','trucking'],'logistics':['logística','freight','trucking']};
const TOOLFAM=[
  ['workiz','housecall','jobber','servicetitan','fieldedge','field service'],
  ['ringcentral','openphone','dialpad','aircall','callrail','8x8','vonage','nextiva','aloware','voip'],
  ['follow up boss','kvcore','lofty','boomtown','cinc','sierra'],
  ['appfolio','buildium','rent manager','yardi','doorloop','tenantcloud'],
  ['hubspot','salesforce','zoho','pipedrive','gohighlevel','monday','crm'],
  ['ams360','applied epic','ezlynx','hawksoft','nowcerts']];
function matchesFor(s){
  const req=s.min_english==='B2'?3:4;
  const tools=(s.tools||'').split(',').map(t=>t.trim().toLowerCase()).filter(Boolean);
  let kws=((s.vertical||'')+' '+(s.role_title||'')).toLowerCase().split(/[^a-záéíóúñ]+/).filter(w=>w.length>3);
  kws.forEach(w=>{if(SYN[w])kws=kws.concat(SYN[w]);});
  kws=[...new Set(kws)];
  const openRoles=SEARCHES.filter(x=>x.status==='Abierta'&&x.id!==s.id&&x.role_title).map(x=>x.role_title.toLowerCase());
  const out=[];
  DATA.forEach(d=>{
    if(['Contratado','Descartado'].includes(stageOf(d)))return;
    const er=engRankOf(d); if(er<req)return;
    const e=edv(d.id); const ivs=e.interviews||[];
    if(ivs.some(iv=>iv.type==='Screen de voz'&&iv.result==='No pasó'))return; // reprobó inglés: fuera
    let pts=d.fit_score*10; const why=[]; const warn=[];
    if(e.verified_english){pts+=10;why.push('✓ '+e.verified_english+' verificado');}
    if(ivs.some(iv=>iv.type==='Screen de voz'&&iv.result==='Pasó')){pts+=15;why.push('✓ screen pasado');}
    if(e.call_score){pts+=(+e.call_score||0)*4;why.push('llamada '+e.call_score+'/5');}
    if(ivs.some(iv=>iv.result==='No se presentó')){pts-=20;warn.push('no se presentó antes');}
    if(d.phone_experience){pts+=8;why.push('teléfono');}
    const thay=((d.tech_tools||[]).join(' ')).toLowerCase();
    let tp=0;tools.forEach(t=>{if(thay.includes(t)){tp+=15;why.push(t);}});pts+=Math.min(tp,30);
    let fp=0;
    tools.forEach(t=>{const fam=TOOLFAM.find(f=>f.some(x=>t.includes(x)||x.includes(t)));
      if(fam&&!thay.includes(t)){const own=fam.find(x=>thay.includes(x));
        if(own&&fp<16){fp+=8;why.push(own+' (misma familia)');}}});
    pts+=fp;
    const rhay=((d.best_fit_roles||[]).join(' ')+' '+(d.industries||[]).join(' ')+' '+(d.headline||'')+' '+(d.strengths||'')).toLowerCase();
    let kp=0;kws.forEach(w=>{if(rhay.includes(w)){kp+=8;if(why.length<8)why.push(w);}});pts+=Math.min(kp,24);
    if(/(usa?|u\.s\.|ee\.?uu|miami|florida|texas|california|new york|llc|inc)/i.test((d.strengths||'')+' '+(d.english_evidence||'')+' '+(d.industries||[]).join(' '))){pts+=10;why.push('exp. EE.UU.');}
    if(/inmediat/i.test(e.availability||''))pts+=8;else if(e.availability)pts+=4;
    if(['Screen de voz','Entrevista','Verificado','Oferta'].includes(stageOf(d)))pts+=6;
    if(/verificar|different name|otra persona|sin cv|no es un cv|mistyped/i.test(d.concerns||'')){pts-=15;warn.push('⚠ alerta de datos');}
    const busy=e.role&&openRoles.includes(e.role.toLowerCase())&&!['Nuevo'].includes(stageOf(d));
    if(busy){pts-=10;warn.push('en otra búsqueda: '+e.role);}
    out.push({d,pts,why:[...new Set(why)],warn:[...new Set(warn)],assigned:!!(e.role&&s.role_title&&e.role.toLowerCase()===s.role_title.toLowerCase())});
  });
  return out.sort((a,b)=>b.pts-a.pts).slice(0,30);
}
function toggleSearchForm(){const f=document.getElementById('sform');if(f)f.style.display=f.style.display==='none'?'block':'none';}
async function saveSearch(){
  const v=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const row={client_name:v('s_client'),role_title:v('s_role'),vertical:v('s_vert'),min_english:v('s_eng'),
    tools:v('s_tools'),hours:v('s_hours'),notes:v('s_notes'),status:'Abierta',created_by:ME};
  if(!row.client_name&&!row.role_title){const m=document.getElementById('smsg');if(m)m.textContent='Pon al menos cliente o rol';return;}
  const {data,error}=await sb.from('talent_searches').insert(row).select();
  const m=document.getElementById('smsg');
  if(error){if(m)m.textContent='⚠ '+error.message;return;}
  if(data&&data[0]){SEARCHES.unshift(data[0]);curSearchId=data[0].id;}
  renderSearch();renderStats();
}
async function closeSearch(id,st){
  const {error}=await sb.from('talent_searches').update({status:st}).eq('id',id);
  if(!error){const s=SEARCHES.find(x=>x.id===id);if(s)s.status=st;renderSearch();renderStats();}
}
async function assignToSearch(cid){
  const s=SEARCHES.find(x=>x.id===curSearchId);if(!s)return;
  const e=ed(cid);e.role=s.role_title||s.client_name;
  if(!e.stage||e.stage==='Nuevo')e.stage='Contactar';
  await persistFields(cid,{role:e.role,stage:e.stage},null);
  renderSearch();renderStats();
}
function pickSearch(id){curSearchId=id;renderSearch();}

  const open=SEARCHES.filter(x=>x.status==='Abierta'), closed=SEARCHES.filter(x=>x.status!=='Abierta');
  const chip=t=>t?String(t).split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join(''):'';

    const n=matchesFor(s).length;

      </div>
    </div>`;};
  const cur=SEARCHES.find(x=>x.id===curSearchId);
  let mhtml='';
  if(cur){
    const ms=matchesFor(cur);
    const MAX=Math.max(ms.length?ms[0].pts:1,1);
    const rows=ms.map(m=>{
      const e=edv(m.d.id);
      return `<tr class="click" data-id="${m.d.id}">

        <td><div class="scoreb"><i style="width:${Math.max(4,Math.min(100,Math.round(m.pts/MAX*100)))}%"></i></div><span class="mono">${m.pts}</span></td>
        <td><div class="why">${m.why.slice(0,6).map(w=>`<span class="tag">${esc(w)}</span>`).join('')}${(m.warn||[]).map(w=>`<span class="tag warn">${esc(w)}</span>`).join('')}</div></td>
        <td>${stageOf(m.d)}${m.assigned?' · <b style="color:var(--teal)">asignado</b>':''}</td>
        <td style="white-space:nowrap">
          ${m.assigned?'':`<button class="btn teal" onclick="event.stopPropagation();assignToSearch(${m.d.id})">Asignar</button>`}
        </td></tr>`;}).join('');
    mhtml=`<div class="panelbox"><h3>Matches — ${esc(cur.client_name||cur.role_title||'')} (${ms.length})</h3>
      <div class="hl" style="margin-bottom:10px">Ranking automático: fit del CV, inglés (los verificados pesan más), teléfono, herramientas y palabras del rubro. "Asignar" los pone en <b>Contactar</b> con el rol de esta búsqueda.</div>
      ${ms.length?`<table class="tb"><tr><th>Candidato</th><th>Score</th><th>Por qué encaja</th><th>Etapa</th><th></th></tr>${rows}</table>`:'<div class="hl">Nadie cumple el inglés mínimo — baja el requisito a B2 o abre screening.</div>'}</div>`;
  }
  document.getElementById('view-search').innerHTML=`
    <div class="panelbox">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h3 style="margin:0">Búsquedas de clientes</h3>
        <button class="btn teal" onclick="toggleSearchForm()">Nueva búsqueda</button>

          <div><label>Vertical / palabras clave</label><input type="text" id="s_vert" placeholder="home services, dispatch, roofing"></div>
          <div><label>Inglés mínimo</label><select id="s_eng"><option>C1</option><option>B2</option></select></div>
          <div><label>Herramientas (separadas por coma)</label><input type="text" id="s_tools" placeholder="Workiz, Housecall Pro, RingCentral"></div>
          <div><label>Horario</label><select id="s_hours"><option>Full-time</option><option>Part-time</option></select></div>
        </div>
        <div class="f1c"><label>Notas del cliente</label><textarea id="s_notes"></textarea></div>
        <div style="margin-top:10px"><button class="btn teal" onclick="saveSearch()">Guardar búsqueda</button><span class="msg" id="smsg"></span></div>
      </div>
    </div>
    ${open.map(scard).join('')||'<div class="panelbox"><div class="hl">Sin búsquedas abiertas. Crea la primera con el requerimiento del cliente y el sistema te rankea el bench.</div></div>'}
    ${mhtml}
    ${closed.length?'<div class="seclbl" style="margin:16px 0 8px">Cerradas</div>'+closed.map(scard).join(''):''}`;
  document.getElementById('view-search').querySelectorAll('tr.click').forEach(tr=>tr.addEventListener('click',()=>openDetail(+tr.dataset.id)));
}

/* ---------- auth + boot ---------- */
async function fetchAll(){
  const [c,e2,iv,sr]=await Promise.all([
    sb.from('talent_candidates').select('data').order('id'),
    sb.from('talent_edits').select('*'),
    sb.from('talent_interviews').select('*').order('id'),
    sb.from('talent_searches').select('*').order('id',{ascending:false})
  ]);
  if(c.error)throw c.error; if(e2.error)throw e2.error; if(iv.error)throw iv.error; if(sr.error)throw sr.error;
  SEARCHES=sr.data||[];
  if(curSearchId==null){const op=SEARCHES.find(x=>x.status==='Abierta');if(op)curSearchId=op.id;}
  DATA=(c.data||[]).map(r=>r.data);
  byId=Object.fromEntries(DATA.map(d=>[d.id,d]));
  EDITS={};
  (e2.data||[]).forEach(r=>{EDITS[r.candidate_id]={stage:r.stage||undefined,role:r.role||undefined,
    verified_english:r.verified_english||undefined,availability:r.availability||undefined,
    salary:r.salary||undefined,call_score:r.call_score||undefined,notes:r.notes||undefined,
    next_action:r.next_action||undefined,next_date:r.next_date||undefined,checks:r.checks||{}};});
  (iv.data||[]).forEach(r=>{const e=ed(r.candidate_id);e.interviews=e.interviews||[];
    e.interviews.push({when:(r.when_at||'').slice(0,16),who:r.who||'',type:r.type||'',result:r.result||'',notes:r.notes||''});});
}
async function boot(){
  const g=document.getElementById('loadmsg');
  try{
    g.textContent='Cargando candidatos…';
    await fetchAll();
    if(!DATA.length){g.textContent='Tu correo no está autorizado para ver los datos. Escríbele a gabriel@assistiq.io.';
      document.getElementById('loginbox').style.display='block';return;}
    populateFilters();
    renderStats();renderView();
    document.getElementById('who').textContent=ME;
    document.getElementById('login').style.display='none';
    g.textContent='';
  }catch(err){g.textContent='Error cargando datos: '+err.message;
    document.getElementById('loginbox').style.display='block';}
}
document.getElementById('loginform').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const m=document.getElementById('loginmsg');m.textContent='Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({
    email:document.getElementById('lg_email').value.trim(),
    password:document.getElementById('lg_pw').value});
  if(error){m.textContent='Credenciales incorrectas.';return;}
  ME=data.session.user.email;m.textContent='';
  await boot();
